services:
  mysql:
    image: mysql:8.4
    container_name: manacine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_root_password
      MYSQL_DATABASE: manacine
      MYSQL_USER: manacine
      MYSQL_PASSWORD: change_database_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: manacine-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build: ./frontend
    container_name: manacine-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
